[package]
name = "bash-resume"
version = "0.1.0"
edition = "2024"
description = "Ejecuta ficheros de pasos de shell línea a línea, recordando por dónde va para poder reanudar"
license = "GPL-3.0-or-later"
repository = "https://github.com/javierjcf/bash-resume"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3"

# Binario de release más pequeño y optimizado (cargo build --release).
[profile.release]
lto = true          # optimiza todos los crates juntos
codegen-units = 1   # una sola unidad de compilación: más optimización, compila más lento
strip = true        # quita los símbolos de depuración
